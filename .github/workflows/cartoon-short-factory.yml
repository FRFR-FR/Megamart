name: Cartoon Short Factory — verify, install, and 10-second render

on:
  push:
    branches: [main]
    paths:
      - cartoon_short_factory_bundle.py
      - .github/workflows/cartoon-short-factory.yml
  workflow_dispatch:

concurrency:
  group: cartoon-short-factory-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  install-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract the verified package
        shell: bash
        run: |
          set -euo pipefail
          python cartoon_short_factory_bundle.py --out "$RUNNER_TEMP/csf-extract"
          test -d "$RUNNER_TEMP/csf-extract/cartoon-short-factory"
          cp -a "$RUNNER_TEMP/csf-extract/cartoon-short-factory/." "$GITHUB_WORKSPACE/"
          test -f SKILL.md
          test -f factory/render/package-lock.json
          test -f factory/render/story.example.json
          test "$(find . -type f -not -path "./.git/*" -not -path "./cartoon_short_factory_bundle.py" | wc -l)" -ge 120

      - name: Commit the exact extracted package to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!cartoon_short_factory_bundle.py' ':!renders/'
          if ! git diff --cached --quiet; then
            git commit -m "Install checksum-verified Cartoon Short Factory package"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Extracted package is already present; no source commit needed."
          fi

      - name: Install the locked renderer dependencies
        run: npm ci --prefix factory/render --no-audit --no-fund

      - name: Install documented Python voice and sound dependencies
        run: python -m pip install kokoro-onnx soundfile numpy

      - name: Install the documented Chromium runtime and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          node factory/render/node_modules/playwright-core/cli.js install --with-deps chromium
          CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 -print -quit)"
          test -n "$CHROME_BIN"
          sudo ln -sf "$CHROME_BIN" /usr/bin/google-chrome
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          test -x /usr/bin/google-chrome
          command -v ffmpeg

      - name: Validate packaged Python and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q factory
          node --check factory/render/render.mjs
          node --check factory/render/lib/characters.js
          node --check factory/render/lib/props.js

      - name: Prepare a continuous 10-second version of the package example
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("factory/render/story.example.json")
          story = json.loads(source.read_text(encoding="utf-8"))
          if not isinstance(story, dict) or "duration" not in story:
              raise SystemExit("Package example does not expose the documented duration field")

          original_duration = float(story["duration"])
          if original_duration <= 0:
              raise SystemExit("Package example duration must be positive")

          factor = 10.0 / original_duration

          def scale_timeline(value):
              if isinstance(value, dict):
                  for key, item in list(value.items()):
                      if key in {"t", "a", "b", "at", "until"} and isinstance(item, (int, float)):
                          value[key] = round(item * factor, 4)
                      else:
                          scale_timeline(item)
              elif isinstance(value, list):
                  for item in value:
                      scale_timeline(item)

          scale_timeline(story)
          # This shipped example uses the "ground" plane at y=0 (not the "land" builder at y=0.8),
          # so retain its default actor spawn height. Keep both walkers on the bridge deck, clear of the approach ramp.
          for index, actor in enumerate(story.get("actors", [])):
              actor.pop("y0", None)
              keys = actor.get("keys", [])
              if keys:
                  keys[0]["z"] = -12.5 if index == 0 else -15.0
                  keys[-1]["z"] = 7.0 if index == 0 else 6.0

          # Keep the bouncing ball clear of the bridge deck collider.
          for prop in story.get("world", []):
              if prop.get("type") == "ball":
                  prop["x"] = 2.4

          # Keep cameras outside the nearby tree/house blocker boxes while staying >5m from actors.
          shots = story.get("shots", [])
          if len(shots) >= 2:
              shots[0]["from"] = [4.2, 2.4, 2.5]
              shots[0]["to"] = [4.4, 2.2, 2.2]
              shots[1]["from"] = [-4.0, 2.5, 2.7]
              shots[1]["to"] = [-4.0, 2.3, 2.7]

          story["duration"] = 10
          output = Path("factory/render/story.10s.json")
          output.write_text(json.dumps(story, indent=2) + "\n", encoding="utf-8")
          print(f"Scaled the package's {original_duration:g}s example scene to 10s (factor {factor:.4f}).")
          PY

      - name: Render the 10-second animation
        working-directory: factory/render
        run: node render.mjs story.10s.json cartoon-short-factory-10s.mp4 --w 540 --h 960 --fps 30 2>&1 | tee render-10s.log

      - name: Verify rendered duration and media stream
        working-directory: factory/render
        shell: bash
        run: |
          set -euo pipefail
          test -s cartoon-short-factory-10s.mp4
          grep -F "PHYSICS AUDIT" render-10s.log
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of json cartoon-short-factory-10s.mp4
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 cartoon-short-factory-10s.mp4)"
          python -c 'import sys; d=float(sys.argv[1]); assert 9.9 <= d <= 10.1, f"Expected 10 seconds, got {d}"' "$DURATION"

      - name: Save animation, story, and QA record in the repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p renders
          cp factory/render/cartoon-short-factory-10s.mp4 renders/cartoon-short-factory-10s.mp4
          cp factory/render/story.10s.json renders/cartoon-short-factory-10s-story.json
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          video = Path("renders/cartoon-short-factory-10s.mp4")
          story = Path("renders/cartoon-short-factory-10s-story.json")
          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries",
              "format=duration:stream=codec_type,codec_name,width,height,r_frame_rate",
              "-of", "json", str(video)
          ], text=True))
          stream = next(s for s in probe["streams"] if s.get("codec_type") == "video")
          log = Path("factory/render/render-10s.log").read_text(encoding="utf-8", errors="replace")
          audit = next((line.split("PHYSICS AUDIT", 1)[1].strip()
                        for line in log.splitlines() if "PHYSICS AUDIT" in line), None)
          if audit is None:
              raise SystemExit("Renderer did not emit its PHYSICS AUDIT line")
          audit_data = json.loads(audit)
          if audit_data.get("fell", 0) != 0:
              raise SystemExit(f"Physics QA failed: fell={audit_data.get('fell')}")
          if audit_data.get("camInside", 0) != 0:
              raise SystemExit(f"Physics QA failed: camInside={audit_data.get('camInside')}")
          if audit_data.get("actorOverlap", 0) != 0:
              raise SystemExit(f"Physics QA failed: actorOverlap={audit_data.get('actorOverlap')}")
          if audit_data.get("visiblePenCm", 999) >= 1:
              raise SystemExit(f"Physics QA failed: visiblePenCm={audit_data.get('visiblePenCm')} (must be < 1)")
          if audit_data.get("over2cm", 999) > 10:
              raise SystemExit(f"Physics QA failed: over2cm={audit_data.get('over2cm')} (must be 10 or fewer)")
          result = {
              "status": "rendered-and-verified",
              "duration_seconds": round(float(probe["format"]["duration"]), 3),
              "width": stream.get("width"),
              "height": stream.get("height"),
              "frame_rate": stream.get("r_frame_rate"),
              "video_codec": stream.get("codec_name"),
              "video_bytes": video.stat().st_size,
              "video_sha256": hashlib.sha256(video.read_bytes()).hexdigest(),
              "story_sha256": hashlib.sha256(story.read_bytes()).hexdigest(),
              "physics_audit": audit
          }
          Path("renders/cartoon-short-factory-10s-qa.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(result, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renders/cartoon-short-factory-10s.mp4 renders/cartoon-short-factory-10s-story.json renders/cartoon-short-factory-10s-qa.json
          git commit -m "Add verified 10-second Cartoon Short Factory animation"
          git push origin HEAD:main
