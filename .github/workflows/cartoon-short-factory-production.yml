name: Cartoon Short Factory — production queue

on:
  workflow_dispatch:
    inputs:
      story_glob:
        description: "Story JSON glob under production/stories"
        required: false
        default: "production/stories/*.json"
      width:
        description: "Output width"
        required: false
        default: "540"
      height:
        description: "Output height"
        required: false
        default: "960"
      fps:
        description: "Frames per second"
        required: false
        default: "30"
  push:
    branches: [main]
    paths:
      - "production/stories/**"
      - ".github/workflows/cartoon-short-factory-production.yml"

concurrency:
  group: cartoon-short-factory-production-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify the installed package
        shell: bash
        run: |
          set -euo pipefail
          test -f SKILL.md
          test -f factory/render/package-lock.json
          test -f factory/render/render.mjs
          test "$(find . -type f -not -path "./.git/*" | wc -l)" -ge 120

      - name: Install Python voice dependencies
        run: python -m pip install --disable-pip-version-check kokoro-onnx soundfile numpy

      - name: Install locked renderer dependencies
        run: npm ci --prefix factory/render --no-audit --no-fund

      - name: Install documented Chromium runtime and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          node factory/render/node_modules/playwright-core/cli.js install --with-deps chromium
          CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 -print -quit)"
          test -n "$CHROME_BIN"
          sudo ln -sf "$CHROME_BIN" /usr/bin/google-chrome
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Download and verify Kokoro British voice model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/csf-kokoro"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/csf-kokoro/kokoro-v1.0.onnx" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/csf-kokoro/voices-v1.0.bin" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin"
          echo "ae315a79b623f244700e4afb9246c46a26066782e049ba174bf3ba433970ee9c  $RUNNER_TEMP/csf-kokoro/kokoro-v1.0.onnx" | sha256sum -c -
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  $RUNNER_TEMP/csf-kokoro/voices-v1.0.bin" | sha256sum -c -

      - name: Download optional NYC street ambience
        shell: bash
        run: |
          set -euo pipefail
          if curl -fL --retry 2 --retry-delay 2 -o "$RUNNER_TEMP/nyc-street-ambience.mp3" "https://soundimage.org/wp-content/uploads/2019/08/Street-Corner_5_30.mp3"; then
            test -s "$RUNNER_TEMP/nyc-street-ambience.mp3"
            echo "NYC_AMBIENCE_READY=true" >> "$GITHUB_ENV"
          else
            echo "NYC_AMBIENCE_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Could not fetch the optional Soundimage street ambience; narration will render without it."
          fi

      - name: Render every queued story
        shell: bash
        env:
          STORY_GLOB: ${{ inputs.story_glob || 'production/stories/*.json' }}
          WIDTH: ${{ inputs.width || '540' }}
          HEIGHT: ${{ inputs.height || '960' }}
          FPS: ${{ inputs.fps || '30' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            mapfile -t stories < <(
              git show --format= --name-only "$GITHUB_SHA" |
                grep -E '^production/stories/.*[.]json$' || true
            )
          else
            shopt -s nullglob
            stories=( $STORY_GLOB )
          fi
          if [ "${#stories[@]}" -eq 0 ]; then
            echo "No stories matched: $STORY_GLOB"
            exit 0
          fi
          mkdir -p production/renders
          for story in "${stories[@]}"; do
            base="$(basename "$story" .json)"
            script="${story%.json}.md"
            out="production/renders/$base.mp4"
            voice_dir="$RUNNER_TEMP/voice-$base"
            test -f "$script"
            mkdir -p "$voice_dir" production/renders
            cp "$RUNNER_TEMP/csf-kokoro/kokoro-v1.0.onnx" "$voice_dir/kokoro-v1.0.onnx"
            cp "$RUNNER_TEMP/csf-kokoro/voices-v1.0.bin" "$voice_dir/voices-v1.0.bin"
            target_duration="$(python -c 'import json,sys; print(float(json.load(open(sys.argv[1]))["duration"]))' "$story")"
            if python -c 'import sys; raise SystemExit(0 if float(sys.argv[1]) <= 35 else 1)' "$target_duration"; then
              lint_range="25-35"
            else
              lint_range="55-70"
            fi
            python factory/tools/lint_script.py "$script" --dur "$lint_range"
            python factory/tools/tts_lines.py "$script" "$voice_dir" --voice bm_george --speed 1.35
            source_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$voice_dir/voice.wav")"
            atempo="$(python -c 'import sys; x=float(sys.argv[1])/float(sys.argv[2]); assert .5 <= x <= 2.0, f"Voice stretch ratio out of safe range: {x}"; print(f"{x:.6f}")' "$source_duration" "$target_duration")"
            ffmpeg -y -loglevel error -i "$voice_dir/voice.wav" -filter:a "atempo=$atempo,apad,atrim=duration=$target_duration" -ar 48000 -ac 1 "$voice_dir/voice-fit.wav"
            if [ "$NYC_AMBIENCE_READY" = "true" ] && [ "$base" = "nyc-walkthrough-60s" ]; then
              ffmpeg -y -loglevel error -i "$voice_dir/voice-fit.wav" -i "$RUNNER_TEMP/nyc-street-ambience.mp3" -filter_complex "[0:a]volume=1.0[voice];[1:a]volume=0.16,atrim=duration=$target_duration[amb];[voice][amb]amix=inputs=2:duration=first:dropout_transition=2,alimiter=limit=0.95[mix]" -map "[mix]" -ar 48000 -ac 1 "$voice_dir/mix.wav"
            else
              cp "$voice_dir/voice-fit.wav" "$voice_dir/mix.wav"
            fi
            echo "Rendering $story -> $out at ${target_duration}s, with British narration."
            node factory/render/render.mjs "$story" "$out" --w "$WIDTH" --h "$HEIGHT" --fps "$FPS" --audio "$voice_dir/mix.wav" 2>&1 | tee "production/renders/$base.log"
            test -s "$out"
            grep -F "PHYSICS AUDIT" "production/renders/$base.log"
          done

      - name: Enforce animation physics and duration QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          for video in Path("production/renders").glob("*.mp4"):
              log = video.with_suffix(".log").read_text(encoding="utf-8", errors="replace")
              lines = [line for line in log.splitlines() if "PHYSICS AUDIT" in line]
              if not lines:
                  raise SystemExit(f"No PHYSICS AUDIT in {video.name}")
              audit = json.loads(lines[-1].split("PHYSICS AUDIT", 1)[1].strip())
              for key in ("fell", "camInside", "actorOverlap"):
                  if audit.get(key, 1) != 0:
                      raise SystemExit(f"{video.name}: {key}={audit.get(key)}")
              if audit.get("visiblePenCm", 999) >= 1:
                  raise SystemExit(f"{video.name}: visiblePenCm={audit.get('visiblePenCm')} (must be <1 cm)")
              if audit.get("over2cm", 999) > 10:
                  raise SystemExit(f"{video.name}: over2cm={audit.get('over2cm')} (must be <=10)")
              probe = json.loads(subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries", "format=duration:stream=codec_type", "-of", "json", str(video)
              ], text=True))
              duration = float(probe["format"]["duration"])
              story = Path("production/stories") / (video.stem + ".json")
              expected = float(json.loads(story.read_text())["duration"])
              if abs(duration - expected) > 0.12:
                  raise SystemExit(f"{video.name}: {duration}s, expected {expected}s")
              print(f"PASS {video.name}: {duration:.2f}s, {audit}")
          PY

      - name: Verify all production outputs
        shell: bash
        run: |
          set -euo pipefail
          for video in production/renders/*.mp4; do
            ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,width,height,r_frame_rate -of json "$video" > "$video.probe.json"
            test -s "$video.probe.json"
          done

      - name: Commit rendered production outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/renders
          if ! git diff --cached --quiet; then
            git commit -m "Render Cartoon Short Factory production queue"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new production outputs to commit."
          fi
